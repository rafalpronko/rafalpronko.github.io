title: Rafał Prońko
description: Blog o ML, LLM i Data Engineering — od podstaw po praktyczne przykłady pracy z danymi i modelami.
url: https://rafalpronko.github.io
baseurl: ""
lang: pl
author: Rafał Prońko
github_username: rafalpronko

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - tests
  - README.md
  - Gemfile
  - Gemfile.lock

# Jekyll pomija pliki zaczynające się od "_" lub "."; przykłady do pobrania muszą być kompletne.
include:
  - __init__.py
  - __main__.py
  - .python-version

# Strony generowane przez GitHub Pages z README przykładów są po angielsku;
# layout example-doc owija treść w .prose (przewijane pre/table na mobile).
defaults:
  - scope:
      path: "assets/examples"
    values:
      lang: en
      layout: example-doc
  - scope:
      path: "assets/code"
    values:
      lang: en
      layout: example-doc
