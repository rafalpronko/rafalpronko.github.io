[project]
name = "train-eval-traps-lab"
version = "0.1.0"
description = "CPU lab: train/eval, padding, checkpoints and seeds in PyTorch 2.2.2"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
]

[dependency-groups]
dev = ["pytest>=8.0,<8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
