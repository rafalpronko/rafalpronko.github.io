[project]
name = "document-system-end-to-end"
version = "0.1.0"
description = "Synthetic SQLite FTS5 document retrieval example (stdlib only)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["examples"]
testpaths = ["examples/tests"]
addopts = "-ra"
