[project]
name = "qlora-quantization-demo"
version = "0.1.0"
description = "CPU demo of blockwise uniform symmetric quantization (not NF4, not QLoRA training)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
