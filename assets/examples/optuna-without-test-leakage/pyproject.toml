[project]
name = "optuna-without-test-leakage"
version = "0.1.0"
description = "Optuna search on development-data CV with one held-out test evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "optuna==3.4.0",
    "scikit-learn==1.3.2",
    "numpy==1.26.2",
    "scipy==1.11.4",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# Resolve every dependency, including transitive ones, from releases
# uploaded before the article's editorial date.
exclude-newer = "2023-12-07T00:00:00Z"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
