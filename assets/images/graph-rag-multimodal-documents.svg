<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Two independent failure modes in document RAG: a candidate path and a discarded table assignment</title>
  <desc id="svg-desc">Left panel, retrieval failure: finding a candidate quality hold for pump P-200 needs a path across two separate documents. Pump P-200 uses alloy KA-7, evidenced in document bom-pumps version 5, page 4, with a bounding box. Alloy KA-7 is subject of hold QH-22, evidenced in document quality-hold version 2, page 1. The hold covers only heat lots 31 to 34 and no evidence gives the heat lot of the P-200 impeller, so QH-22 is a candidate hold and its applicability is unknown. The candidate path is visible only to readers allowed to see both sources, here the quality team. Right panel, ingestion failure: a table with rows P-200 and P-300 and a column Max pressure in bar keeps the value 16 bar assigned to P-200 with cell coordinates. An unordered bag of tokens built from the same table has identical token counts when the pressures 16 and 10 are swapped, so the bag cannot say which value belongs to P-200; ordered or delimited text could still keep the rows. Footer: a graph does not restore a lost column, and a layout model does not answer a global question.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38E1FF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#0B1426"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#E6F1FF">
    <text x="600" y="54" font-size="30" font-weight="700" text-anchor="middle">Two independent failure modes</text>
    <text x="600" y="84" font-size="17" fill="#A9BCD0" text-anchor="middle">Find where the information was lost before adding a graph or a layout-aware model</text>

    <!-- Left panel: retrieval / relationships -->
    <rect x="40" y="110" width="540" height="470" rx="14" fill="#111D36" stroke="#38E1FF" stroke-width="1.5"/>
    <text x="64" y="148" font-size="21" font-weight="700" fill="#38E1FF">1 · Retrieval: relationships and coverage</text>
    <text x="64" y="176" font-size="15" fill="#A9BCD0">“Is there a candidate quality hold for pump P-200?”</text>

    <rect x="64" y="200" width="230" height="200" rx="8" fill="#0B1426" stroke="#5C7393" stroke-dasharray="5 4"/>
    <text x="78" y="224" font-size="14" fill="#A9BCD0">bom-pumps · v5 · p.4</text>
    <rect x="326" y="200" width="230" height="200" rx="8" fill="#0B1426" stroke="#5C7393" stroke-dasharray="5 4"/>
    <text x="340" y="224" font-size="14" fill="#A9BCD0">quality-hold · v2 · p.1</text>

    <circle cx="130" cy="300" r="40" fill="#16284A" stroke="#38E1FF" stroke-width="2"/>
    <text x="130" y="306" font-size="17" font-weight="700" text-anchor="middle">P-200</text>
    <circle cx="310" cy="300" r="40" fill="#16284A" stroke="#38E1FF" stroke-width="2"/>
    <text x="310" y="306" font-size="17" font-weight="700" text-anchor="middle">KA-7</text>
    <circle cx="490" cy="300" r="40" fill="#16284A" stroke="#38E1FF" stroke-width="2"/>
    <text x="490" y="306" font-size="17" font-weight="700" text-anchor="middle">QH-22</text>

    <line x1="172" y1="300" x2="266" y2="300" stroke="#38E1FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="219" y="290" font-size="14" text-anchor="middle">uses</text>
    <line x1="352" y1="300" x2="446" y2="300" stroke="#38E1FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="399" y="290" font-size="14" text-anchor="middle">subject_of</text>

    <text x="78" y="372" font-size="13" fill="#A9BCD0">bbox (72, 310, 290, 324)</text>
    <text x="340" y="354" font-size="13" fill="#A9BCD0">heat lots 31-34 only</text>
    <text x="340" y="372" font-size="13" fill="#A9BCD0">bbox (56, 120, 520, 150)</text>
    <text x="78" y="390" font-size="13" fill="#A9BCD0">readers: engineering, quality</text>
    <text x="340" y="390" font-size="13" fill="#A9BCD0">readers: quality</text>

    <text x="64" y="432" font-size="15">Neither document names both P-200 and QH-22. Each</text>
    <text x="64" y="453" font-size="15">edge carries its own document, version, page and box.</text>
    <text x="64" y="474" font-size="15">The path makes QH-22 a candidate hold only: it covers</text>
    <text x="64" y="495" font-size="15">heat lots 31-34, and the P-200 heat lot is unknown.</text>
    <rect x="64" y="510" width="492" height="46" rx="8" fill="#0B1426" stroke="#38E1FF"/>
    <text x="80" y="539" font-size="16">Candidate path visible to: <tspan font-weight="700" fill="#38E1FF">quality</tspan> (intersection)</text>

    <!-- Right panel: ingestion / structure -->
    <rect x="620" y="110" width="540" height="470" rx="14" fill="#111D36" stroke="#FFB454" stroke-width="1.5"/>
    <text x="644" y="148" font-size="21" font-weight="700" fill="#FFB454">2 · Ingestion: lost structure</text>
    <text x="644" y="176" font-size="15" fill="#A9BCD0">“What is the maximum pressure of P-200?”</text>

    <text x="644" y="212" font-size="15" font-weight="700">Kept: row × column + cell box</text>
    <g font-size="15">
      <rect x="644" y="224" width="492" height="108" fill="#0B1426" stroke="#5C7393"/>
      <line x1="644" y1="260" x2="1136" y2="260" stroke="#5C7393"/>
      <line x1="644" y1="296" x2="1136" y2="296" stroke="#5C7393"/>
      <line x1="750" y1="224" x2="750" y2="332" stroke="#5C7393"/>
      <line x1="960" y1="224" x2="960" y2="332" stroke="#5C7393"/>
      <text x="660" y="248" fill="#A9BCD0">Pump</text>
      <text x="766" y="248" fill="#A9BCD0">Max pressure (bar)</text>
      <text x="976" y="248" fill="#A9BCD0">Impeller alloy</text>
      <text x="660" y="284">P-200</text>
      <rect x="752" y="262" width="206" height="32" fill="none" stroke="#38E1FF" stroke-width="2.5"/>
      <text x="766" y="284" font-weight="700" fill="#38E1FF">16</text>
      <text x="976" y="284">KA-7</text>
      <text x="660" y="320">P-300</text>
      <text x="766" y="320">10</text>
      <text x="976" y="320">KB-2</text>
    </g>
    <text x="644" y="358" font-size="14" fill="#A9BCD0">P-200 = 16 bar · bom-pumps v5 p.4 bbox (300, 310, 410, 324)</text>

    <text x="644" y="404" font-size="15" font-weight="700">Flattened: unordered bag of tokens (order discarded)</text>
    <rect x="644" y="416" width="492" height="56" rx="6" fill="#0B1426" stroke="#FFB454" stroke-dasharray="6 4"/>
    <text x="658" y="440" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">{Pump, P-200, P-300, Max, pressure, (bar),</text>
    <text x="658" y="460" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"> Impeller, alloy, 16, 10, KA-7, KB-2}</text>
    <text x="644" y="496" font-size="14">Swap 16 and 10: same counts. Ordered rows could keep them.</text>
    <rect x="644" y="510" width="492" height="46" rx="8" fill="#0B1426" stroke="#FFB454"/>
    <text x="660" y="539" font-size="15">P-200 = <tspan font-weight="700" fill="#FFB454">?</tspan>  The bag discarded the row and column.</text>

    <text x="600" y="624" font-size="18" text-anchor="middle">A graph does not restore a lost column. A layout model does not answer a global question.</text>
    <text x="600" y="652" font-size="13" fill="#A9BCD0" text-anchor="middle">Synthetic example: documents, identifiers and coordinates are invented for illustration.</text>
  </g>
</svg>
