<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t31-title t31-desc">
  <title id="t31-title">Four experiment traps in PyTorch: train/eval, padding, checkpoints and seeds</title>
  <desc id="t31-desc">Four panels. Panel one: model.eval() and torch.no_grad() are two independent switches, one for layer behaviour such as Dropout and BatchNorm, the other for gradient recording. Panel two: a sequence padded to length six; a plain mean divides by six while a masked mean divides by the two real tokens, and an all-padding row is rejected. Panel three: state_dict() returns references that follow later training, while a deepcopy snapshot keeps old values; a resumable checkpoint stores model, optimizer, RNG and data order state. Panel four: the seed is set before the model is built, and results are reported across several seeds.</desc>
  <rect width="960" height="540" fill="#0b1220"/>
  <g fill="none" stroke="#1d3350" stroke-width="1">
    <path d="M0 270H960M480 0V540"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d7e3f4">
    <!-- Panel 1 -->
    <g transform="translate(24 24)">
      <rect width="432" height="222" rx="6" fill="#0f1a2c" stroke="#38E1FF" stroke-width="1.5"/>
      <text x="16" y="30" font-size="15" fill="#38E1FF">01 // TRAIN/EVAL ≠ NO_GRAD</text>
      <rect x="16" y="52" width="190" height="70" rx="4" fill="#132540" stroke="#4b6a8f"/>
      <text x="28" y="78" font-size="14">model.eval()</text>
      <text x="28" y="100" font-size="12" fill="#9fb3cc">Dropout · BatchNorm</text>
      <rect x="226" y="52" width="190" height="70" rx="4" fill="#132540" stroke="#4b6a8f"/>
      <text x="238" y="78" font-size="14">torch.no_grad()</text>
      <text x="238" y="100" font-size="12" fill="#9fb3cc">autograd recording</text>
      <text x="16" y="146" font-size="12" fill="#9fb3cc">two switches, set both for inference</text>
      <text x="16" y="168" font-size="12" fill="#ffb454">train mode + no_grad → BN stats leak</text>
      <text x="16" y="190" font-size="12" fill="#ffb454">eval mode still allows gradients</text>
      <text x="16" y="210" font-size="12" fill="#ffb454">backward + opt.step() can update weights</text>
    </g>
    <!-- Panel 2 -->
    <g transform="translate(504 24)">
      <rect width="432" height="222" rx="6" fill="#0f1a2c" stroke="#38E1FF" stroke-width="1.5"/>
      <text x="16" y="30" font-size="15" fill="#38E1FF">02 // PADDING IS NOT A MASK</text>
      <g font-size="13" text-anchor="middle">
        <rect x="16" y="50" width="44" height="34" fill="#1f4a63" stroke="#38E1FF"/><text x="38" y="72">3</text>
        <rect x="64" y="50" width="44" height="34" fill="#1f4a63" stroke="#38E1FF"/><text x="86" y="72">7</text>
        <rect x="112" y="50" width="44" height="34" fill="#132540" stroke="#4b6a8f"/><text x="134" y="72" fill="#9fb3cc">PAD</text>
        <rect x="160" y="50" width="44" height="34" fill="#132540" stroke="#4b6a8f"/><text x="182" y="72" fill="#9fb3cc">PAD</text>
        <rect x="208" y="50" width="44" height="34" fill="#132540" stroke="#4b6a8f"/><text x="230" y="72" fill="#9fb3cc">PAD</text>
        <rect x="256" y="50" width="44" height="34" fill="#132540" stroke="#4b6a8f"/><text x="278" y="72" fill="#9fb3cc">PAD</text>
      </g>
      <text x="16" y="116" font-size="12" fill="#ffb454">x.mean(dim=1)       sum / 6  (wrong)</text>
      <text x="16" y="140" font-size="12" fill="#7ee0a1">masked_mean(x, m)   sum / 2</text>
      <text x="16" y="164" font-size="12" fill="#9fb3cc">all-PAD row → ValueError</text>
      <text x="16" y="194" font-size="12" fill="#9fb3cc">padding_idx: zero row, no gradient</text>
      <text x="16" y="212" font-size="12" fill="#9fb3cc">ignore_index: loss only, not forward</text>
    </g>
    <!-- Panel 3 -->
    <g transform="translate(24 294)">
      <rect width="432" height="222" rx="6" fill="#0f1a2c" stroke="#38E1FF" stroke-width="1.5"/>
      <text x="16" y="30" font-size="15" fill="#38E1FF">03 // CHECKPOINT = MORE THAN WEIGHTS</text>
      <text x="16" y="62" font-size="12" fill="#ffb454">state_dict()        → references (alias)</text>
      <text x="16" y="84" font-size="12" fill="#7ee0a1">deepcopy(state_dict) → snapshot</text>
      <g font-size="12">
        <rect x="16" y="104" width="94" height="30" rx="3" fill="#1f4a63" stroke="#38E1FF"/><text x="63" y="124" text-anchor="middle">model</text>
        <rect x="118" y="104" width="94" height="30" rx="3" fill="#132540" stroke="#4b6a8f"/><text x="165" y="124" text-anchor="middle">optimizer</text>
        <rect x="220" y="104" width="94" height="30" rx="3" fill="#132540" stroke="#4b6a8f"/><text x="267" y="124" text-anchor="middle">torch RNG</text>
        <rect x="322" y="104" width="94" height="30" rx="3" fill="#132540" stroke="#4b6a8f"/><text x="369" y="124" text-anchor="middle">data RNG</text>
      </g>
      <text x="16" y="160" font-size="12" fill="#9fb3cc">inference needs: model</text>
      <text x="16" y="182" font-size="12" fill="#9fb3cc">resume needs: all four (+ scheduler)</text>
      <text x="16" y="206" font-size="12" fill="#9fb3cc">torch.load(..., weights_only=True)</text>
    </g>
    <!-- Panel 4 -->
    <g transform="translate(504 294)">
      <rect width="432" height="222" rx="6" fill="#0f1a2c" stroke="#38E1FF" stroke-width="1.5"/>
      <text x="16" y="30" font-size="15" fill="#38E1FF">04 // SEEDS</text>
      <text x="16" y="62" font-size="12" fill="#7ee0a1">torch.manual_seed(s)  then  Model()</text>
      <text x="16" y="84" font-size="12" fill="#ffb454">Model()  then  manual_seed(s): too late</text>
      <g stroke="#38E1FF" stroke-width="2" fill="none">
        <path d="M40 190 L120 150 L200 168 L280 132 L360 140"/>
        <path d="M40 186 L120 160 L200 150 L280 146 L360 128" stroke="#7ee0a1"/>
        <path d="M40 194 L120 170 L200 160 L280 156 L360 150" stroke="#ffb454"/>
      </g>
      <text x="376" y="132" font-size="11" fill="#9fb3cc">s=0,1,2</text>
      <text x="16" y="212" font-size="12" fill="#9fb3cc">report the spread, not the best seed</text>
    </g>
  </g>
</svg>
