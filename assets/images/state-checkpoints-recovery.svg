<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="ckpt-title ckpt-desc">
  <title id="ckpt-title">Checkpoint commit and crash recovery in one SQLite file</title>
  <desc id="ckpt-desc">Top: a pure workflow step runs, then one transaction stores its result and advances the cursor. A crash before COMMIT is rolled back and the step runs again; a crash after COMMIT resumes at the next step. Bottom: a step with an external effect first commits a pending operation, then sends it with a stable operation id to a separate receiver, then commits the receipt and the cursor. Between sending and that commit the outcome is ambiguous, so a restart replays the same operation id and relies on the receiver to deduplicate. The state file holds the run cursor with workflow version and input digest, step results, and operations.</desc>
  <rect width="780" height="480" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <text x="30" y="40" font-size="14" font-weight="600">Pure step: normalize, classify, summarize</text>

    <rect x="30" y="60" width="150" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="46" y="74" width="4" height="42" rx="2" fill="#7b5aad"/>
    <text x="62" y="92" font-size="14" font-weight="600">Execute step</text>
    <text x="62" y="112" font-size="12" fill="#52606b">reads stored inputs</text>

    <rect x="215" y="60" width="250" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="231" y="74" width="4" height="42" rx="2" fill="#168a87"/>
    <text x="247" y="92" font-size="14" font-weight="600">BEGIN IMMEDIATE</text>
    <text x="247" y="112" font-size="12" fill="#52606b">write result, cursor + 1</text>

    <rect x="500" y="60" width="100" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="516" y="74" width="4" height="42" rx="2" fill="#168a87"/>
    <text x="532" y="101" font-size="14" font-weight="600">COMMIT</text>

    <rect x="635" y="60" width="115" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="651" y="74" width="4" height="42" rx="2" fill="#7b5aad"/>
    <text x="667" y="101" font-size="14" font-weight="600">Next step</text>

    <g fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M182 95 H209"/><path d="M204 90 L210 95 L204 100"/>
      <path d="M467 95 H494"/><path d="M489 90 L495 95 L489 100"/>
      <path d="M602 95 H629"/><path d="M624 90 L630 95 L624 100"/>
    </g>

    <g stroke="#b5473a" stroke-width="2" fill="none">
      <path d="M482 100 V141" stroke-dasharray="4 3"/>
      <path d="M617 100 V141" stroke-dasharray="4 3"/>
      <circle cx="482" cy="150" r="9" fill="#fbeee9"/>
      <circle cx="617" cy="150" r="9" fill="#fbeee9"/>
      <path d="M478 146 L486 154 M486 146 L478 154"/>
      <path d="M613 146 L621 154 M621 146 L613 154"/>
    </g>
    <text x="470" y="176" font-size="12" text-anchor="end" font-weight="600">Crash before COMMIT</text>
    <text x="470" y="194" font-size="12" text-anchor="end" fill="#52606b">rolled back; step runs again</text>
    <text x="629" y="176" font-size="12" font-weight="600">Crash after COMMIT</text>
    <text x="629" y="194" font-size="12" fill="#52606b">resume at next step</text>

    <text x="30" y="226" font-size="14" font-weight="600">Step with an external effect: notify</text>
    <path d="M320 262 V252 H525 V262" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="422" y="246" font-size="12" text-anchor="middle" fill="#b5473a">ambiguous window: effect may exist, ack not stored</text>

    <rect x="30" y="268" width="170" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="46" y="282" width="4" height="42" rx="2" fill="#168a87"/>
    <text x="62" y="300" font-size="14" font-weight="600">Record intent</text>
    <text x="62" y="320" font-size="12" fill="#52606b">pending, COMMIT</text>

    <rect x="235" y="268" width="170" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="251" y="282" width="4" height="42" rx="2" fill="#7b5aad"/>
    <text x="267" y="300" font-size="14" font-weight="600">Send</text>
    <text x="267" y="320" font-size="12" fill="#52606b">same operation id</text>

    <rect x="440" y="268" width="170" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="456" y="282" width="4" height="42" rx="2" fill="#168a87"/>
    <text x="472" y="300" font-size="14" font-weight="600">Commit receipt</text>
    <text x="472" y="320" font-size="12" fill="#52606b">result, cursor + 1</text>

    <text x="630" y="292" font-size="12" font-weight="600">Restart here:</text>
    <text x="630" y="310" font-size="12" fill="#52606b">replay the same id;</text>
    <text x="630" y="328" font-size="12" fill="#52606b">receiver deduplicates</text>

    <rect x="235" y="358" width="170" height="44" rx="10" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="5 4"/>
    <text x="320" y="377" font-size="12" text-anchor="middle" font-weight="600">Receiver (other file)</text>
    <text x="320" y="394" font-size="12" text-anchor="middle" fill="#52606b">key: operation id</text>

    <g fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M202 303 H229"/><path d="M224 298 L230 303 L224 308"/>
      <path d="M407 303 H434"/><path d="M429 298 L435 303 L429 308"/>
      <path d="M320 340 V352"/><path d="M315 347 L320 353 L325 347"/>
    </g>

    <rect x="30" y="418" width="720" height="46" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="46" y="437" font-size="12" font-weight="600">state.db (one SQLite file)</text>
    <text x="46" y="455" font-size="12" fill="#52606b">run: cursor, workflow version, input digest · step_result · operation: id, request digest, status, receipt</text>
  </g>
</svg>
