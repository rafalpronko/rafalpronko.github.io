<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="lora-title lora-desc">
  <title id="lora-title">LoRA on a frozen linear layer, with a separate evaluation protocol</title>
  <desc id="lora-desc">Top: the input x of size k goes through the frozen base weight W0 of shape d by k, and in parallel through a trainable low-rank path, first A of shape r by k, then B of shape d by r, scaled by alpha over r. The two outputs are added to give h. A starts random and B starts at zero, so the model starts equal to the base. Bottom: four separate data splits. Source data fits W0. Target train updates the trainable weights. Target validation chooses the learning rate, checkpoint and rank. Target test is locked and read once, after selection.</desc>
  <rect width="680" height="420" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <text x="40" y="44" font-size="15" font-weight="600">h = W0 x + (α / r) · B A x</text>

    <rect x="40" y="96" width="70" height="56" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="75" y="122" font-size="14" font-weight="600" text-anchor="middle">x</text>
    <text x="75" y="141" font-size="11" fill="#52606b" text-anchor="middle">k = 16</text>

    <path d="M110 112 H200" fill="none" stroke="#8b99a5" stroke-width="2"/>
    <path d="M110 140 C150 140 150 196 190 196" fill="none" stroke="#8b99a5" stroke-width="2"/>

    <rect x="200" y="70" width="230" height="74" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="216" y="86" width="4" height="42" rx="2" fill="#52606b"/>
    <text x="232" y="101" font-size="14" font-weight="600">W0 · frozen base</text>
    <text x="232" y="122" font-size="12" fill="#52606b">d × k = 8 × 16, no gradient</text>

    <rect x="190" y="166" width="104" height="60" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="202" y="178" width="4" height="36" rx="2" fill="#168a87"/>
    <text x="214" y="192" font-size="13" font-weight="600">A  r × k</text>
    <text x="214" y="212" font-size="11" fill="#52606b">random init</text>
    <path d="M294 196 H316" fill="none" stroke="#8b99a5" stroke-width="2"/>
    <rect x="316" y="166" width="114" height="60" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="328" y="178" width="4" height="36" rx="2" fill="#168a87"/>
    <text x="340" y="192" font-size="13" font-weight="600">B  d × r</text>
    <text x="340" y="212" font-size="11" fill="#52606b">zero init</text>
    <text x="310" y="246" font-size="11" fill="#52606b" text-anchor="middle">trainable: r(d + k) · scaled by α / r</text>

    <path d="M430 107 C470 107 470 140 492 140" fill="none" stroke="#8b99a5" stroke-width="2"/>
    <path d="M430 196 C470 196 470 160 492 160" fill="none" stroke="#8b99a5" stroke-width="2"/>
    <circle cx="510" cy="150" r="18" fill="#ffffff" stroke="#8b99a5" stroke-width="2"/>
    <text x="510" y="156" font-size="18" text-anchor="middle">+</text>
    <path d="M528 150 H560" fill="none" stroke="#8b99a5" stroke-width="2"/>
    <rect x="560" y="122" width="80" height="56" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="600" y="148" font-size="14" font-weight="600" text-anchor="middle">h</text>
    <text x="600" y="166" font-size="11" fill="#52606b" text-anchor="middle">d = 8</text>

    <text x="40" y="294" font-size="13" font-weight="600">Separate data, separate decisions</text>
    <rect x="40" y="308" width="140" height="72" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="54" y="332" font-size="12" font-weight="600">Source</text>
    <text x="54" y="352" font-size="11" fill="#52606b">fits W0</text>
    <rect x="192" y="308" width="140" height="72" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="206" y="332" font-size="12" font-weight="600">Target train</text>
    <text x="206" y="352" font-size="11" fill="#52606b">updates A, B or W</text>
    <rect x="344" y="308" width="140" height="72" rx="10" fill="#ffffff" stroke="#7b5aad"/>
    <text x="358" y="332" font-size="12" font-weight="600">Target validation</text>
    <text x="358" y="352" font-size="11" fill="#52606b">picks lr, step, rank</text>
    <rect x="496" y="308" width="144" height="72" rx="10" fill="#ffffff" stroke="#b5483b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="510" y="332" font-size="12" font-weight="600">Target test · locked</text>
    <text x="510" y="352" font-size="11" fill="#52606b">read once, after</text>
    <text x="510" y="368" font-size="11" fill="#52606b">selection</text>
  </g>
</svg>
