<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Timeline of one LLM request: prefill produces the first token, decode steps add one KV entry per layer each</title>
  <desc id="desc">Left to right along a time axis. A dashed box for queueing, tokenization and transfers comes first. Then the prefill block: layers run one after another, and inside each layer all six prompt positions are processed together. The last prompt position yields token 1, which marks time to first token. Four decode steps follow; step n takes token n as input, projects one new position in every layer and emits token n plus one. A lower lane shows each layer's key/value cache: six entries after prefill, then seven, eight, nine and ten, with the newly appended entry highlighted. Braces mark time to first token, one inter-token interval, and total response time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#0b1220"/>
  <text x="30" y="36" fill="#e6edf3" font-size="18" font-weight="bold">One request: prefill → first token → cached decode</text>

  <!-- compute lane -->
  <text x="30" y="70" fill="#9fb3c8" font-size="12">COMPUTE</text>
  <rect x="30" y="90" width="110" height="90" rx="6" fill="none" stroke="#9fb3c8" stroke-dasharray="5 4"/>
  <text x="85" y="122" fill="#c9d4df" font-size="12" text-anchor="middle">queue</text>
  <text x="85" y="140" fill="#c9d4df" font-size="12" text-anchor="middle">tokenize</text>
  <text x="85" y="158" fill="#c9d4df" font-size="12" text-anchor="middle">transfer</text>

  <rect x="150" y="80" width="240" height="110" rx="6" fill="#10233a" stroke="#38bdf8"/>
  <text x="270" y="74" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">PREFILL (P = 6 prompt positions)</text>
  <g font-size="11" fill="#e6edf3">
    <text x="158" y="105">layer 1</text>
    <text x="158" y="140">layer 2</text>
    <text x="158" y="175">layer L</text>
  </g>
  <g fill="#38bdf8" opacity="0.85">
    <rect x="215" y="92" width="26" height="18"/><rect x="243" y="92" width="26" height="18"/><rect x="271" y="92" width="26" height="18"/><rect x="299" y="92" width="26" height="18"/><rect x="327" y="92" width="26" height="18"/><rect x="355" y="92" width="26" height="18"/>
    <rect x="215" y="127" width="26" height="18"/><rect x="243" y="127" width="26" height="18"/><rect x="271" y="127" width="26" height="18"/><rect x="299" y="127" width="26" height="18"/><rect x="327" y="127" width="26" height="18"/><rect x="355" y="127" width="26" height="18"/>
    <rect x="215" y="162" width="26" height="18"/><rect x="243" y="162" width="26" height="18"/><rect x="271" y="162" width="26" height="18"/><rect x="299" y="162" width="26" height="18"/><rect x="327" y="162" width="26" height="18"/><rect x="355" y="162" width="26" height="18"/>
  </g>
  <text x="270" y="208" fill="#c9d4df" font-size="10" text-anchor="middle">positions in parallel, layers in sequence</text>

  <line x1="402" y1="84" x2="402" y2="445" stroke="#fbbf24" stroke-dasharray="4 3"/>
  <circle cx="402" cy="135" r="7" fill="#fbbf24"/>
  <text x="410" y="230" fill="#fbbf24" font-size="12">token 1</text>
  <text x="410" y="246" fill="#fbbf24" font-size="10">(from last prompt logit)</text>

  <g font-size="11" text-anchor="middle">
    <rect x="415" y="90" width="125" height="90" rx="6" fill="#1e1a0f" stroke="#fbbf24"/>
    <text x="477" y="110" fill="#fbbf24" font-weight="bold">decode 1</text>
    <text x="477" y="130" fill="#e6edf3">in: token 1</text>
    <text x="477" y="148" fill="#e6edf3">out: token 2</text>
    <text x="477" y="168" fill="#9fb3c8">1 pos × L layers</text>

    <rect x="550" y="90" width="125" height="90" rx="6" fill="#1e1a0f" stroke="#fbbf24"/>
    <text x="612" y="110" fill="#fbbf24" font-weight="bold">decode 2</text>
    <text x="612" y="130" fill="#e6edf3">in: token 2</text>
    <text x="612" y="148" fill="#e6edf3">out: token 3</text>
    <text x="612" y="168" fill="#9fb3c8">1 pos × L layers</text>

    <rect x="685" y="90" width="125" height="90" rx="6" fill="#1e1a0f" stroke="#fbbf24"/>
    <text x="747" y="110" fill="#fbbf24" font-weight="bold">decode 3</text>
    <text x="747" y="130" fill="#e6edf3">in: token 3</text>
    <text x="747" y="148" fill="#e6edf3">out: token 4</text>
    <text x="747" y="168" fill="#9fb3c8">1 pos × L layers</text>

    <rect x="820" y="90" width="125" height="90" rx="6" fill="#1e1a0f" stroke="#fbbf24"/>
    <text x="882" y="110" fill="#fbbf24" font-weight="bold">decode 4</text>
    <text x="882" y="130" fill="#e6edf3">in: token 4</text>
    <text x="882" y="148" fill="#e6edf3">out: token 5</text>
    <text x="882" y="168" fill="#9fb3c8">1 pos × L layers</text>
  </g>

  <!-- KV cache lane -->
  <text x="30" y="285" fill="#9fb3c8" font-size="12">KV CACHE</text>
  <text x="30" y="302" fill="#9fb3c8" font-size="11">(every layer</text>
  <text x="30" y="317" fill="#9fb3c8" font-size="11">keeps its own)</text>
  <g fill="#38bdf8">
    <rect x="198" y="290" width="10" height="26"/><rect x="210" y="290" width="10" height="26"/><rect x="222" y="290" width="10" height="26"/><rect x="234" y="290" width="10" height="26"/><rect x="246" y="290" width="10" height="26"/><rect x="258" y="290" width="10" height="26"/>
  </g>
  <text x="233" y="336" fill="#c9d4df" font-size="11" text-anchor="middle">6 K/V entries</text>

  <g fill="#38bdf8">
    <rect x="420" y="290" width="10" height="26"/><rect x="432" y="290" width="10" height="26"/><rect x="444" y="290" width="10" height="26"/><rect x="456" y="290" width="10" height="26"/><rect x="468" y="290" width="10" height="26"/><rect x="480" y="290" width="10" height="26"/>
    <rect x="555" y="290" width="10" height="26"/><rect x="567" y="290" width="10" height="26"/><rect x="579" y="290" width="10" height="26"/><rect x="591" y="290" width="10" height="26"/><rect x="603" y="290" width="10" height="26"/><rect x="615" y="290" width="10" height="26"/><rect x="627" y="290" width="10" height="26"/>
    <rect x="690" y="290" width="10" height="26"/><rect x="702" y="290" width="10" height="26"/><rect x="714" y="290" width="10" height="26"/><rect x="726" y="290" width="10" height="26"/><rect x="738" y="290" width="10" height="26"/><rect x="750" y="290" width="10" height="26"/><rect x="762" y="290" width="10" height="26"/><rect x="774" y="290" width="10" height="26"/>
    <rect x="825" y="290" width="10" height="26"/><rect x="837" y="290" width="10" height="26"/><rect x="849" y="290" width="10" height="26"/><rect x="861" y="290" width="10" height="26"/><rect x="873" y="290" width="10" height="26"/><rect x="885" y="290" width="10" height="26"/><rect x="897" y="290" width="10" height="26"/><rect x="909" y="290" width="10" height="26"/><rect x="921" y="290" width="10" height="26"/>
  </g>
  <g fill="#fbbf24">
    <rect x="492" y="290" width="10" height="26"/>
    <rect x="639" y="290" width="10" height="26"/>
    <rect x="786" y="290" width="10" height="26"/>
    <rect x="933" y="290" width="10" height="26"/>
  </g>
  <g font-size="11" fill="#c9d4df" text-anchor="middle">
    <text x="477" y="336">7 (+1 new)</text>
    <text x="612" y="336">8 (+1 new)</text>
    <text x="747" y="336">9 (+1 new)</text>
    <text x="882" y="336">10 (+1 new)</text>
  </g>
  <text x="680" y="365" fill="#9fb3c8" font-size="11" text-anchor="middle">old entries are read again every step, never rewritten (causal mask)</text>

  <!-- latency spans -->
  <line x1="30" y1="400" x2="400" y2="400" stroke="#fbbf24" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="215" y="393" fill="#fbbf24" font-size="12" text-anchor="middle">time to first token (TTFT)</text>
  <line x1="541" y1="400" x2="676" y2="400" stroke="#e6edf3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="608" y="393" fill="#e6edf3" font-size="12" text-anchor="middle">inter-token latency</text>
  <line x1="30" y1="440" x2="945" y2="440" stroke="#9fb3c8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="487" y="432" fill="#c9d4df" font-size="12" text-anchor="middle">total response time</text>

  <line x1="30" y1="485" x2="945" y2="485" stroke="#9fb3c8" marker-end="url(#arrow)"/>
  <text x="935" y="505" fill="#9fb3c8" font-size="11" text-anchor="end">time →</text>
  <text x="30" y="525" fill="#6b7f95" font-size="10">Schematic, not to scale. Durations depend on hardware, batch, prompt and output length.</text>
</svg>
