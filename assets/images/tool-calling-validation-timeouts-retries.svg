<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Tool calling with validation, timeouts, and bounded retries</title>
  <desc id="d">A left-to-right pipeline. An untrusted model proposal goes through strict parsing and argument validation, then a server-side allowlist and authorization check, then execution under a per-attempt timeout and an overall budget. Only read-only calls that fail with a timeout or a known transient error loop back for a bounded retry. The result is validated and returned as a structured outcome. Rejected proposals go back to the model as sanitized feedback for repair. Writes that time out end as unknown effect and need reconciliation, not a retry.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6edf3"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0d1117"/>
  <text x="60" y="78" fill="#e6edf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" font-weight="700">Tool calling: validate, bound, retry safely</text>
  <text x="60" y="116" fill="#9da7b3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">a model's tool call is a proposal, not an instruction</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" text-anchor="middle">
    <rect x="40" y="250" width="170" height="110" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="3"/>
    <text x="125" y="295" fill="#f0883e" font-weight="700">untrusted</text>
    <text x="125" y="322" fill="#e6edf3">proposal</text>

    <rect x="250" y="250" width="170" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="335" y="295" fill="#e6edf3" font-weight="700">strict parse</text>
    <text x="335" y="322" fill="#9da7b3">types, keys</text>

    <rect x="460" y="250" width="170" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="545" y="295" fill="#e6edf3" font-weight="700">allowlist</text>
    <text x="545" y="322" fill="#9da7b3">+ authorize</text>

    <rect x="670" y="250" width="170" height="110" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <text x="755" y="295" fill="#e6edf3" font-weight="700">execute</text>
    <text x="755" y="322" fill="#9da7b3">timeout+budget</text>

    <rect x="880" y="250" width="130" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="945" y="295" fill="#e6edf3" font-weight="700">validate</text>
    <text x="945" y="322" fill="#9da7b3">output</text>

    <rect x="1040" y="250" width="130" height="110" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="3"/>
    <text x="1105" y="295" fill="#e6edf3" font-weight="700">outcome</text>
    <text x="1105" y="322" fill="#9da7b3">structured</text>
  </g>

  <g stroke="#e6edf3" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="210" y1="305" x2="246" y2="305"/>
    <line x1="420" y1="305" x2="456" y2="305"/>
    <line x1="630" y1="305" x2="666" y2="305"/>
    <line x1="840" y1="305" x2="876" y2="305"/>
    <line x1="1010" y1="305" x2="1036" y2="305"/>
  </g>

  <!-- bounded retry loop for reads -->
  <path d="M790 250 C 790 180, 720 180, 720 246" stroke="#3fb950" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="755" y="170" fill="#3fb950" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">retry: reads only, transient/timeout, capped</text>

  <!-- repair path back to the model -->
  <path d="M440 360 C 440 470, 125 470, 125 364" stroke="#f0883e" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="285" y="500" fill="#f0883e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">rejected: sanitized code, model may repair</text>

  <!-- write path -->
  <path d="M755 360 L 755 440" stroke="#f85149" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="755" y="472" fill="#f85149" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">write timed out: unknown effect,</text>
  <text x="755" y="496" fill="#f85149" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">reconcile, never blind retry</text>

  <text x="60" y="585" fill="#9da7b3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">global limits per request: max repairs, max tool calls · CancelledError always propagates</text>
</svg>
