<svg xmlns="http://www.w3.org/2000/svg" lang="en" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="packing-title packing-desc">
  <title id="packing-title">First-fit decreasing versus a bounded local repair</title>
  <desc id="packing-desc">Items of sizes 5, 4, 4, 3, 2 and 2 with bin capacity 10. First-fit decreasing uses three bins: 5 and 4, then 4, 3 and 2, then a lone 2. The local repair pools these three bins and re-packs them into two full bins: 5, 3 and 2, and 4, 4 and 2. A note below says that on a 40-instance synthetic corpus the repair improved 3 of 20 uniform instances and all 20 triplet instances by one bin, never made a result worse, and left every triplet instance 3 bins above its optimum.</desc>
  <rect width="680" height="400" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <text x="156" y="44" text-anchor="middle" font-size="15" font-weight="600">First-fit decreasing: 3 bins</text>
    <text x="528" y="44" text-anchor="middle" font-size="15" font-weight="600">After local repair: 2 bins</text>
    <text x="156" y="66" text-anchor="middle" font-size="12" fill="#52606b">capacity 10, lower bound ceil(20/10) = 2</text>
    <text x="528" y="66" text-anchor="middle" font-size="12" fill="#52606b">accepted only because a bin disappeared</text>
    <rect x="60" y="120" width="56" height="160" rx="4" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="4 3"/>
    <rect x="63" y="201.5" width="50" height="77" rx="3" fill="#0f7774"/>
    <text x="88.0" y="245.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">5</text>
    <rect x="63" y="137.5" width="50" height="61" rx="3" fill="#7b5aad"/>
    <text x="88.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
    <text x="88.0" y="300" text-anchor="middle" font-size="12" fill="#52606b">9/10</text>
    <rect x="138" y="120" width="56" height="160" rx="4" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="4 3"/>
    <rect x="141" y="217.5" width="50" height="61" rx="3" fill="#7b5aad"/>
    <text x="166.0" y="253.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
    <rect x="141" y="169.5" width="50" height="45" rx="3" fill="#9b5f20"/>
    <text x="166.0" y="197.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">3</text>
    <rect x="141" y="137.5" width="50" height="29" rx="3" fill="#3f6fb0"/>
    <text x="166.0" y="157.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
    <text x="166.0" y="300" text-anchor="middle" font-size="12" fill="#52606b">9/10</text>
    <rect x="216" y="120" width="56" height="160" rx="4" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="4 3"/>
    <rect x="219" y="249.5" width="50" height="29" rx="3" fill="#3f6fb0"/>
    <text x="244.0" y="269.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
    <text x="244.0" y="300" text-anchor="middle" font-size="12" fill="#52606b">2/10</text>
    <rect x="470" y="120" width="56" height="160" rx="4" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="4 3"/>
    <rect x="473" y="201.5" width="50" height="77" rx="3" fill="#0f7774"/>
    <text x="498.0" y="245.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">5</text>
    <rect x="473" y="153.5" width="50" height="45" rx="3" fill="#9b5f20"/>
    <text x="498.0" y="181.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">3</text>
    <rect x="473" y="121.5" width="50" height="29" rx="3" fill="#3f6fb0"/>
    <text x="498.0" y="141.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
    <text x="498.0" y="300" text-anchor="middle" font-size="12" fill="#52606b">10/10</text>
    <rect x="548" y="120" width="56" height="160" rx="4" fill="#ffffff" stroke="#8b99a5" stroke-dasharray="4 3"/>
    <rect x="551" y="217.5" width="50" height="61" rx="3" fill="#7b5aad"/>
    <text x="576.0" y="253.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
    <rect x="551" y="153.5" width="50" height="61" rx="3" fill="#7b5aad"/>
    <text x="576.0" y="189.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
    <rect x="551" y="121.5" width="50" height="29" rx="3" fill="#3f6fb0"/>
    <text x="576.0" y="141.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
    <text x="576.0" y="300" text-anchor="middle" font-size="12" fill="#52606b">10/10</text>
    <path d="M318 200 H446" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M440 194 L447 200 L440 206" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="184" text-anchor="middle" font-size="12" fill="#52606b">pool 3 bins,</text>
    <text x="382" y="222" text-anchor="middle" font-size="12" fill="#52606b">exact search into 2</text>
    <rect x="40" y="326" width="600" height="54" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="340" y="348" text-anchor="middle" font-size="12">Corpus, 40 instances: uniform 3 improve / 17 tie / 0 worse; triplet 20 improve / 0 tie / 0 worse.</text>
    <text x="340" y="367" text-anchor="middle" font-size="12" fill="#52606b">Every triplet instance still uses 23 bins where 20 are optimal.</text>
  </g>
</svg>
