<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="rag-title rag-desc">
  <title id="rag-title">A first local RAG pipeline with application-owned citations</title>
  <desc id="rag-desc">A question goes to a TF-IDF retriever over three hash-verified RFC 9110 extracts. If no passage scores above the threshold, the application refuses without calling the model. Otherwise the top passages are placed in a prompt within a 512-token budget, flan-t5-small generates an answer on the CPU, and the application attaches citations taken from the retrieved passages, not from the model output.</desc>
  <rect width="680" height="470" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <rect x="40" y="28" width="250" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="58" y="44" width="4" height="38" rx="2" fill="#168a87"/>
    <text x="76" y="58" font-size="14" font-weight="600">Local corpus</text>
    <text x="76" y="80" font-size="12" fill="#52606b">3 RFC 9110 extracts + SHA-256</text>

    <rect x="390" y="28" width="250" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="408" y="44" width="4" height="38" rx="2" fill="#168a87"/>
    <text x="426" y="58" font-size="14" font-weight="600">Question</text>
    <text x="426" y="80" font-size="12" fill="#52606b">from the user</text>

    <path d="M165 100 V128 H330 V140 M515 100 V128 H330" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M325 139 L330 145 L335 139" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="165" y="150" width="330" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="183" y="166" width="4" height="38" rx="2" fill="#7b5aad"/>
    <text x="201" y="180" font-size="14" font-weight="600">TF-IDF retriever (lexical)</text>
    <text x="201" y="202" font-size="12" fill="#52606b">top 3 paragraphs, score at least 0.1</text>

    <path d="M495 185 H540" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M539 180 L545 185 L539 190" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="550" y="150" width="110" height="70" rx="12" fill="#fff4f2" stroke="#e7b9b0"/>
    <text x="605" y="176" font-size="12" font-weight="600" text-anchor="middle">No match:</text>
    <text x="605" y="194" font-size="12" text-anchor="middle">refuse, no</text>
    <text x="605" y="210" font-size="12" text-anchor="middle">model call</text>

    <path d="M330 222 V250" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M325 249 L330 255 L335 249" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="165" y="260" width="330" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="183" y="276" width="4" height="38" rx="2" fill="#7b5aad"/>
    <text x="201" y="290" font-size="14" font-weight="600">Prompt within 512 tokens</text>
    <text x="201" y="312" font-size="12" fill="#52606b">whole passages, quoted as context</text>

    <path d="M330 332 V360" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M325 359 L330 365 L335 359" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="370" width="290" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="58" y="386" width="4" height="38" rx="2" fill="#d08a1e"/>
    <text x="76" y="400" font-size="14" font-weight="600">flan-t5-small on CPU</text>
    <text x="76" y="422" font-size="12" fill="#52606b">generated text: may be wrong</text>

    <rect x="350" y="370" width="290" height="70" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="368" y="386" width="4" height="38" rx="2" fill="#168a87"/>
    <text x="386" y="400" font-size="14" font-weight="600">Citations from retrieval</text>
    <text x="386" y="422" font-size="12" fill="#52606b">URL, section, paragraph, SHA-256</text>
  </g>
</svg>
