<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="prf-title prf-desc">
  <title id="prf-title">Choosing between prompting, retrieval and fine-tuning by diagnosing the failure (simplified)</title>
  <desc id="prf-desc">Simplified hypotheses and recommended architecture, assuming complete and sufficient gold evidence. Collect failing cases and keep a grouped holdout, then re-run each case with the gold passage in context. At any stage, an answer that cannot be read, or has the right content in the wrong shape, is an output-contract problem. If the answer is wrong even with gold context, add instructions and examples taken from development groups: if that fixes the content, suspect behaviour, so keep the examples or consider an adapter when the convention must hold cheaply; if not, suspect base-model capability, so decompose the task or try another base model and tune only with evidence; until that run exists the label is gold context fails. If the answer is right with gold context, check the end-to-end answer: if it is correct and contract-valid, the case passes and stays in the regression set; if not, check whether retrieval put the gold passage in the top k: if not, fix retrieval; if it did, fix what reaches the model, such as conflicting versions, distractors and the abstention rule. Outside the model, on every path: the example implements schema validation and checks that cited passages were in the supplied context and are current. Access control at retrieval and acting on rejected answers are recommended but not implemented in the example.</desc>
  <defs>
    <marker id="prf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b99a5"/>
    </marker>
  </defs>
  <rect width="780" height="680" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <!-- steps -->
    <rect x="190" y="20" width="400" height="46" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="390" y="48" font-size="14" font-weight="600" text-anchor="middle">1. Collect failing cases, keep a grouped holdout</text>
    <rect x="190" y="86" width="400" height="46" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="390" y="114" font-size="14" font-weight="600" text-anchor="middle">2. Re-run each case with the gold passage</text>

    <!-- output contract, checked at every stage -->
    <rect x="606" y="80" width="156" height="58" rx="10" fill="#ffffff" stroke="#8a6d3b" stroke-dasharray="5 4"/>
    <text x="616" y="99" font-size="12" font-weight="600">Output contract</text>
    <g font-size="11" fill="#52606b">
      <text x="616" y="115">unreadable, or right</text>
      <text x="616" y="129">content in wrong shape</text>
    </g>

    <!-- decisions -->
    <g fill="#fff7e6" stroke="#d9a441">
      <rect x="240" y="152" width="300" height="44" rx="22"/>
      <rect x="30" y="232" width="272" height="72" rx="22"/>
      <rect x="400" y="232" width="350" height="44" rx="22"/>
      <rect x="322" y="330" width="282" height="44" rx="22"/>
    </g>
    <text x="390" y="179" font-size="13" font-weight="600" text-anchor="middle">Correct with gold context?</text>
    <text x="166" y="256" font-size="12" font-weight="600" text-anchor="middle">Add instructions + examples</text>
    <text x="166" y="274" font-size="12" font-weight="600" text-anchor="middle">from dev groups. Correct now?</text>
    <text x="166" y="292" font-size="11" fill="#52606b" text-anchor="middle">not run yet: gold context fails</text>
    <text x="575" y="259" font-size="13" font-weight="600" text-anchor="middle">Correct + valid end to end?</text>
    <text x="463" y="357" font-size="13" font-weight="600" text-anchor="middle">Gold passage in retrieved top-k?</text>

    <!-- arrows -->
    <g fill="none" stroke="#8b99a5" stroke-width="2" marker-end="url(#prf-arrow)">
      <path d="M390 66 V84"/>
      <path d="M390 132 V150"/>
      <path d="M590 109 H604"/>
      <path d="M240 174 H166 V230"/>
      <path d="M540 174 H575 V230"/>
      <path d="M98 304 V418"/>
      <path d="M244 304 V418"/>
      <path d="M682 276 V418"/>
      <path d="M463 276 V328"/>
      <path d="M390 374 V418"/>
      <path d="M536 374 V418"/>
    </g>
    <g font-size="12" fill="#52606b">
      <text x="200" y="167">no</text>
      <text x="548" y="167">yes</text>
      <text x="104" y="330">yes</text>
      <text x="250" y="330">no</text>
      <text x="688" y="306">yes</text>
      <text x="469" y="306">no</text>
      <text x="396" y="400">no</text>
      <text x="542" y="400">yes</text>
    </g>

    <!-- outcomes -->
    <g fill="#ffffff" stroke="#dce3e8">
      <rect x="30" y="420" width="136" height="120" rx="10"/>
      <rect x="176" y="420" width="136" height="120" rx="10"/>
      <rect x="322" y="420" width="136" height="120" rx="10"/>
      <rect x="468" y="420" width="136" height="120" rx="10"/>
      <rect x="614" y="420" width="136" height="120" rx="10"/>
    </g>
    <g>
      <rect x="40" y="432" width="116" height="4" rx="2" fill="#7b5aad"/>
      <rect x="186" y="432" width="116" height="4" rx="2" fill="#b4513a"/>
      <rect x="332" y="432" width="116" height="4" rx="2" fill="#168a87"/>
      <rect x="478" y="432" width="116" height="4" rx="2" fill="#2f6db5"/>
      <rect x="624" y="432" width="116" height="4" rx="2" fill="#4c8a3a"/>
    </g>
    <g font-size="13" font-weight="600">
      <text x="42" y="456">Behaviour?</text>
      <text x="188" y="456">Capability?</text>
      <text x="334" y="456">Retrieval</text>
      <text x="480" y="456">Context use</text>
      <text x="626" y="456">Pass</text>
    </g>
    <g font-size="12" fill="#52606b">
      <text x="42" y="476">Keep the examples;</text>
      <text x="42" y="492">adapter or fine-tune</text>
      <text x="42" y="508">if it must hold</text>
      <text x="42" y="524">cheaply</text>
      <text x="188" y="476">Decompose the task</text>
      <text x="188" y="492">or try another base</text>
      <text x="188" y="508">model; tune only</text>
      <text x="188" y="524">with evidence</text>
      <text x="334" y="476">Query, vocabulary,</text>
      <text x="334" y="492">chunking, index,</text>
      <text x="334" y="508">metadata filters</text>
      <text x="480" y="476">Conflicting</text>
      <text x="480" y="492">versions,</text>
      <text x="480" y="508">distractors,</text>
      <text x="480" y="524">abstention rule</text>
      <text x="626" y="476">Keep the case in</text>
      <text x="626" y="492">the regression set</text>
    </g>

    <!-- guardrails band: recommended architecture -->
    <rect x="30" y="560" width="720" height="100" rx="10" fill="#26323d"/>
    <text x="48" y="584" font-size="13" font-weight="600" fill="#ffffff">Outside the model, on every path (recommended architecture)</text>
    <text x="48" y="608" font-size="12" fill="#e4e9ed">In the example: validate the schema · cited passages must be in the supplied context and current</text>
    <text x="48" y="630" font-size="12" fill="#e4e9ed">Recommended, not in the example: access control at retrieval · block or retry rejected answers</text>
    <text x="48" y="648" font-size="11" fill="#b9c3cb">Simplified hypotheses; sufficient gold assumed. Exact rule: diagnose() in harness.py</text>
  </g>
</svg>
