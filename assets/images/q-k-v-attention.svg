<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="qkv-title qkv-desc">
  <title id="qkv-title">Single-head scaled dot-product attention on a 3 × 2 matrix</title>
  <desc id="qkv-desc">Input X with 3 positions and 2 features is multiplied by three different 2 by 2 matrices W_Q, W_K and W_V, giving Q, K and V, each 3 by 2. Q times K transposed divided by the square root of 2 gives a 3 by 3 score matrix (rows are query positions i, columns are key positions j). A softmax along each row gives 3 by 3 weights whose rows sum to 1. Weights times V gives a 3 by 2 output. Row 0 is highlighted: scores 0, 0.7071, 0.7071; weights 0.1978, 0.4011, 0.4011; output 0.5989, 2.2033. Q and K decide routing, V supplies content. No causal mask, a single head and no position information.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8a96"/></marker></defs>
  <rect width="960" height="540" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <text x="30" y="36" font-size="18" font-weight="700">Single-head scaled dot-product attention on a 3 × 2 matrix</text>
    <text x="30" y="224" font-size="15" font-weight="700">X</text>
    <text x="30" y="241" font-size="12" fill="#52606b">3 × 2 input</text>
    <rect x="30" y="250" width="128" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <text x="62.0" y="267.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="126.0" y="267.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="62.0" y="293.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="126.0" y="293.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="62.0" y="319.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="126.0" y="319.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="250" y="64" font-size="15" font-weight="700">Q = X·W_Q</text>
    <text x="250" y="81" font-size="12" fill="#52606b">3 × 2 queries</text>
    <rect x="250" y="90" width="128" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <text x="282.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="282.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="282.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text>
    <text x="346.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="250" y="224" font-size="15" font-weight="700">K = X·W_K</text>
    <text x="250" y="241" font-size="12" fill="#52606b">3 × 2 keys</text>
    <rect x="250" y="250" width="128" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <text x="282.0" y="267.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="346.0" y="267.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="282.0" y="293.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="293.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="282.0" y="319.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="319.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="250" y="384" font-size="15" font-weight="700">V = X·W_V</text>
    <text x="250" y="401" font-size="12" fill="#52606b">3 × 2 values (content)</text>
    <rect x="250" y="410" width="128" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <text x="282.0" y="427.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="427.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="282.0" y="453.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="346.0" y="453.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text>
    <text x="282.0" y="479.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text>
    <text x="346.0" y="479.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text>
    <line x1="160" y1="270" x2="240" y2="140" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="172" y="190" font-size="12" fill="#7b5aad" font-weight="600">W_Q</text>
    <line x1="160" y1="289" x2="240" y2="289" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="186" y="282" font-size="12" fill="#7b5aad" font-weight="600">W_K</text>
    <line x1="160" y1="308" x2="240" y2="440" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="172" y="392" font-size="12" fill="#7b5aad" font-weight="600">W_V</text>
    <text x="460" y="64" font-size="15" font-weight="700">scores = QKᵀ / √2</text>
    <text x="460" y="81" font-size="12" fill="#52606b">3 × 3, row i = query, column j = key</text>
    <rect x="460" y="90" width="192" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <rect x="461" y="91" width="190" height="24" rx="5" fill="#d8f0ef" stroke="#168a87"/>
    <text x="492.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="556.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7071</text>
    <text x="620.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7071</text>
    <text x="492.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7071</text>
    <text x="556.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7071</text>
    <text x="620.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1.4142</text>
    <text x="492.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7071</text>
    <text x="556.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">1.4142</text>
    <text x="620.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2.1213</text>
    <line x1="380" y1="128" x2="450" y2="128" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="380" y1="280" x2="450" y2="150" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="250" y="200" font-size="12" fill="#52606b">Q, K → routing</text>
    <text x="720" y="64" font-size="15" font-weight="700">weights = softmax(rows)</text>
    <text x="720" y="81" font-size="12" fill="#52606b">3 × 3, each row sums to 1</text>
    <rect x="720" y="90" width="192" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <rect x="721" y="91" width="190" height="24" rx="5" fill="#d8f0ef" stroke="#168a87"/>
    <text x="752.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.1978</text>
    <text x="816.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.4011</text>
    <text x="880.0" y="107.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.4011</text>
    <text x="752.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.2483</text>
    <text x="816.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.2483</text>
    <text x="880.0" y="133.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.5035</text>
    <text x="752.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.14</text>
    <text x="816.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.284</text>
    <text x="880.0" y="159.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.576</text>
    <line x1="656" y1="128" x2="710" y2="128" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="720" y="354" font-size="15" font-weight="700">output = weights·V</text>
    <text x="720" y="371" font-size="12" fill="#52606b">3 × 2, one row per query</text>
    <rect x="720" y="380" width="128" height="78" rx="6" fill="#ffffff" stroke="#9aa8b4"/>
    <rect x="721" y="381" width="126" height="24" rx="5" fill="#d8f0ef" stroke="#168a87"/>
    <text x="752.0" y="397.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.5989</text>
    <text x="816.0" y="397.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2.2033</text>
    <text x="752.0" y="423.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.7517</text>
    <text x="816.0" y="423.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2.2552</text>
    <text x="752.0" y="449.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">0.716</text>
    <text x="816.0" y="449.5" font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">2.4359</text>
    <line x1="816" y1="172" x2="816" y2="334" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="826" y="260" font-size="12" fill="#52606b">mix rows of V</text>
    <line x1="380" y1="448" x2="710" y2="420" stroke="#7b8a96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="470" y="458" font-size="12" fill="#52606b">V: content, does not change weights</text>
    <rect x="440" y="200" width="250" height="120" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="456" y="224" font-size="13" font-weight="700" fill="#0f6e6c">Highlighted row i = 0</text>
    <text x="456" y="248" font-size="12">scores [0, 0.7071, 0.7071]</text>
    <text x="456" y="270" font-size="12">weights [0.1978, 0.4011, 0.4011]</text>
    <text x="456" y="292" font-size="12">output [0.5989, 2.2033]</text>
    <text x="456" y="310" font-size="11" fill="#52606b">no causal mask, one head, no positions</text>
  </g>
</svg>
