<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="hitl-title hitl-desc">
  <title id="hitl-title">Human-in-the-loop state machine with crash reconciliation</title>
  <desc id="hitl-desc">A proposed setting change is approved by a human for an exact value, device version and expiry. The coordinator records a durable intent before sending a conditional command to a device that keeps its own store. After the send the coordinator may see acknowledgement, rejection, timeout or crash. Timeout and surviving intent flow to reconciliation, which asks the device log: command found means applied; not found with unchanged version means not applied; not found with a changed version is a conflict that stops the attempt. Only confirmed applied state can move through a fresh device read, new proposal and new approval toward compensation.</desc>
  <rect width="760" height="580" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <text x="30" y="40" font-size="16" font-weight="600">Approved intent is not observed reality</text>
    <text x="30" y="60" font-size="12" fill="#52606b">coordinator.db and device.db are separate files: no shared transaction</text>

    <!-- left column: the forward path -->
    <rect x="30" y="80" width="340" height="62" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="48" y="96" width="4" height="30" rx="2" fill="#8b99a5"/>
    <text x="66" y="106" font-size="14" font-weight="600">1. Proposal</text>
    <text x="66" y="127" font-size="12" fill="#52606b">reads current value and version (v)</text>

    <path d="M200 144 V158" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M195 157 L200 163 L205 157" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="30" y="166" width="340" height="62" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="48" y="182" width="4" height="30" rx="2" fill="#7b5aad"/>
    <text x="66" y="192" font-size="14" font-weight="600">2. Approval (simulated operator)</text>
    <text x="66" y="213" font-size="12" fill="#52606b">exact value, version v, expiry; single use</text>

    <path d="M200 230 V244" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M195 243 L200 249 L205 243" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="30" y="252" width="340" height="62" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="48" y="268" width="4" height="30" rx="2" fill="#168a87"/>
    <text x="66" y="278" font-size="14" font-weight="600">3. Guards + durable INTENT</text>
    <text x="66" y="299" font-size="12" fill="#52606b">one local transaction: commit all or roll back</text>

    <path d="M200 316 V330" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M195 329 L200 335 L205 329" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="30" y="338" width="340" height="62" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="48" y="354" width="4" height="30" rx="2" fill="#168a87"/>
    <text x="66" y="364" font-size="14" font-weight="600">4. Conditional send to device</text>
    <text x="66" y="385" font-size="12" fill="#52606b">applies only at version v; dedup by command_id</text>

    <!-- right column: what the coordinator may see -->
    <path d="M372 369 H392" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M392 218 V374" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M392 218 H404" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M403 213 L409 218 L403 223" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 270 H404" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M403 265 L409 270 L403 275" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 322 H404" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M403 317 L409 322 L403 327" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 374 H404" stroke="#8b99a5" stroke-width="2" stroke-linecap="round"/>
    <path d="M403 369 L409 374 L403 379" fill="none" stroke="#8b99a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="410" y="182" font-size="14" font-weight="600">What the coordinator sees</text>
    <rect x="410" y="196" width="320" height="44" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="426" y="223" font-size="12"><tspan font-weight="600">ack recorded</tspan> → APPLIED</text>
    <rect x="410" y="248" width="320" height="44" rx="10" fill="#ffffff" stroke="#dce3e8"/>
    <text x="426" y="275" font-size="12"><tspan font-weight="600">device refused</tspan> → REJECTED (definite)</text>
    <rect x="410" y="300" width="320" height="44" rx="10" fill="#fff8eb" stroke="#e6c98f"/>
    <text x="426" y="327" font-size="12"><tspan font-weight="600">timeout</tspan> → UNKNOWN, not failed</text>
    <rect x="410" y="352" width="320" height="44" rx="10" fill="#fff8eb" stroke="#e6c98f"/>
    <text x="426" y="379" font-size="12"><tspan font-weight="600">crash</tspan> → INTENT stays on disk</text>

    <path d="M730 218 H744 V418 H600" stroke="#7b5aad" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M599 413 L605 418 L599 423" fill="none" stroke="#7b5aad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M410 322 H381 V418" stroke="#b08a3e" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M410 374 H381" stroke="#b08a3e" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M376 417 L381 423 L386 417" fill="none" stroke="#b08a3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- bottom: reconciliation and compensation -->
    <rect x="30" y="428" width="420" height="132" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="48" y="444" width="4" height="100" rx="2" fill="#b08a3e"/>
    <text x="66" y="454" font-size="14" font-weight="600">Reconcile on restart (ask the device)</text>
    <text x="66" y="480" font-size="12" fill="#52606b">command_id in device log → APPLIED</text>
    <text x="66" y="502" font-size="12" fill="#52606b">not in log, still at v → NOT_APPLIED</text>
    <text x="66" y="524" font-size="12" fill="#a33b3b" font-weight="600">not in log, version moved → CONFLICT</text>
    <text x="66" y="544" font-size="12" fill="#a33b3b">stop: a human decides, nothing is resent</text>

    <rect x="470" y="428" width="260" height="132" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="488" y="444" width="4" height="100" rx="2" fill="#7b5aad"/>
    <text x="506" y="454" font-size="14" font-weight="600">Compensation</text>
    <text x="506" y="480" font-size="12" fill="#52606b">fresh device read → proposal</text>
    <text x="506" y="502" font-size="12" fill="#52606b">new approval → action</text>
    <text x="506" y="524" font-size="12" fill="#52606b">confirmed → COMPENSATED</text>
    <text x="506" y="544" font-size="12" fill="#a33b3b">diverged → refuse</text>
  </g>
</svg>
