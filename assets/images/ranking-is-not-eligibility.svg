<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Hard constraints before scores</title>
  <desc id="gate-desc">Normalized facts and a versioned policy enter a hard gate. The gate sorts every opportunity into eligible, pending or rejected. A known failure is rejected even if other facts are missing; a missing fact without a failure is pending. Only eligible opportunities are scored, sorted by score with the identifier as a tie-break, and cut to the top k. Pending and rejected opportunities are never ranked. Before action, the caller supplies fresh authoritative facts and the current policy, whose rules are immutable per version. Revalidation checks the chosen opportunity; the action endpoint must enforce atomic preconditions where facts or policy can change.</desc>
  <rect width="680" height="470" rx="16" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26323d">
    <rect x="100" y="24" width="480" height="66" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="122" y="38" width="4" height="38" rx="2" fill="#52606b"/>
    <text x="146" y="53" font-size="14" font-weight="600">Normalized facts + policy@version</text>
    <text x="146" y="74" font-size="12" fill="#52606b">remote, verified minimum EUR per hour; None = unknown</text>

    <path d="M340 92 V107" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round"/>
    <path d="M335 106 L340 112 L345 106" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="100" y="116" width="480" height="66" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="122" y="130" width="4" height="38" rx="2" fill="#7b5aad"/>
    <text x="146" y="145" font-size="14" font-weight="600">Hard gate (no scores here)</text>
    <text x="146" y="166" font-size="12" fill="#52606b">Each constraint: pass, fail or unknown</text>

    <path d="M160 184 V203 M340 184 V203 M520 184 V203" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round"/>
    <path d="M155 202 L160 208 L165 202 M335 202 L340 208 L345 202 M515 202 L520 208 L525 202" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="212" width="190" height="78" rx="12" fill="#ffffff" stroke="#168a87" stroke-width="2"/>
    <text x="58" y="238" font-size="14" font-weight="600" fill="#11615f">Eligible</text>
    <text x="58" y="259" font-size="12" fill="#52606b">every constraint known</text>
    <text x="58" y="277" font-size="12" fill="#52606b">and satisfied</text>

    <rect x="245" y="212" width="190" height="78" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
    <text x="263" y="238" font-size="14" font-weight="600" fill="#8a5a12">Pending</text>
    <text x="263" y="259" font-size="12" fill="#52606b">no failure, a fact missing</text>
    <text x="263" y="277" font-size="12" fill="#52606b">verify or manual queue</text>

    <rect x="450" y="212" width="190" height="78" rx="12" fill="#ffffff" stroke="#b83a3a" stroke-width="2"/>
    <text x="468" y="238" font-size="14" font-weight="600" fill="#8f2a2a">Rejected</text>
    <text x="468" y="259" font-size="12" fill="#52606b">a known failure</text>
    <text x="468" y="277" font-size="12" fill="#52606b">dominates any unknown</text>

    <path d="M160 292 V311" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round"/>
    <path d="M155 310 L160 316 L165 310" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="314" font-size="12" fill="#52606b" text-anchor="middle">never scored</text>
    <text x="545" y="314" font-size="12" fill="#52606b" text-anchor="middle">never scored</text>

    <rect x="40" y="320" width="600" height="58" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="62" y="332" width="4" height="34" rx="2" fill="#168a87"/>
    <text x="86" y="345" font-size="14" font-weight="600">Rank eligible only</text>
    <text x="86" y="365" font-size="12" fill="#52606b">sort by (-score, id), then take top k; an empty list stays empty</text>

    <path d="M340 380 V395" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round"/>
    <path d="M335 394 L340 400 L345 394" fill="none" stroke="#52606b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="404" width="600" height="50" rx="12" fill="#ffffff" stroke="#dce3e8"/>
    <rect x="62" y="414" width="4" height="30" rx="2" fill="#52606b"/>
    <text x="86" y="434" font-size="14" font-weight="600">Revalidate with current facts and the same policy version, then act</text>
  </g>
</svg>
